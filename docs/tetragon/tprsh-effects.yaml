# Example Tetragon TracingPolicy producing the kprobe events the tprsh
# Tetragon adapter maps (internal/sensor/tetragon). Process exec/exit events
# are emitted by Tetragon without any policy.
#
# Parses and validates with Tetragon's own policy loader
# (pkg/tracingpolicy.FromFile, checked against cilium/tetragon a58fbc7), but
# has NOT been loaded into a live agent. Review the path lists for your hosts
# before use. This policy only observes (no Sigkill/Override actions); tprsh is
# a record layer, not a sandbox.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tprsh-effects
spec:
  kprobes:
  # Outbound TCP connections -> net_connect.
  - call: "tcp_connect"
    syscall: false
    args:
    - index: 0
      type: "sock"
  # File access -> file_write (mask bit 2 = MAY_WRITE) and, for credential
  # paths, file_read_sensitive (mask bit 4 = MAY_READ). "Mask" matches when
  # any listed bit is set, so a read+write open (6) is caught by both.
  # Selectors are OR'ed; matchArgs within one selector are AND'ed.
  - call: "security_file_permission"
    syscall: false
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/home/"
        - "/root/"
        - "/etc/"
        - "/var/lib/"
        - "/srv/"
      - index: 1
        operator: "Mask"
        values:
        - "2"
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "/.aws/credentials"
        - "/.aws/config"
        - "/.kube/config"
        - "/.docker/config.json"
        - "/.netrc"
        - "/.git-credentials"
        - "/.pgpass"
        - "/.npmrc"
        - "/.pypirc"
        - "/.ssh/id_rsa"
        - "/.ssh/id_ed25519"
        - "/.ssh/id_ecdsa"
        - "/etc/shadow"
        - "/.env"
      - index: 1
        operator: "Mask"
        values:
        - "4"
  # Truncation -> file_write.
  - call: "security_path_truncate"
    syscall: false
    args:
    - index: 0
      type: "path"
